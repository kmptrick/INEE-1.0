# ============================================================
# Nginx — claude.inee.lu
#  - sert l'appli statique (/)
#  - proxifie le backend multi-utilisateurs (/api) vers le port 3007
# Référence : sur le serveur, le fichier actif est géré par certbot dans
#   /etc/nginx/sites-enabled/claude.inee.lu
# Il suffit d'AJOUTER le bloc « location /api/ » ci-dessous dans le server { 443 }.
# ============================================================

server {
    listen 80;
    server_name claude.inee.lu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name claude.inee.lu;

    ssl_certificate     /etc/letsencrypt/live/claude.inee.lu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claude.inee.lu/privkey.pem;

    # Backend API (auth, projets, conversations, fichiers, chat streaming)
    location /api/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;     # le streaming peut être long
        proxy_buffering off;          # important pour le flux SSE (réponses en direct)
        chunked_transfer_encoding on;
    }

    # Appli statique
    root /opt/inee/claude-app;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
