# ============================================================
# Nginx — sous-domaine claude.inee.lu (appli statique)
# À copier sur le serveur dans : /etc/nginx/sites-available/claude.inee.lu
# puis lier : ln -s /etc/nginx/sites-available/claude.inee.lu /etc/nginx/sites-enabled/
# (ou dans /etc/nginx/conf.d/claude.inee.lu.conf selon ton organisation actuelle —
#  vérifie où se trouve déjà resto : grep -r resto.inee.lu /etc/nginx/)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name claude.inee.lu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name claude.inee.lu;

    # --- Certificat SSL ---
    # Option A (Let's Encrypt / certbot) — chemins par défaut :
    ssl_certificate     /etc/letsencrypt/live/claude.inee.lu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claude.inee.lu/privkey.pem;
    # Option B (même style que resto, certs manuels) — décommente et adapte :
    # ssl_certificate     /etc/nginx/ssl/claude/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/claude/key.pem;

    # --- Fichiers statiques de l'appli ---
    root /opt/inee/claude-app;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache léger des assets
    location ~* \.(?:css|js|svg|png|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
